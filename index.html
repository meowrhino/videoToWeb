<!DOCTYPE html>
<html lang="es">
<head>
  <script src="coi-serviceworker.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>video a webM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Upload Area -->
    <div class="upload-area" id="uploadArea">
      <svg class="upload-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <h3 id="uploadTitle">arrastra vídeos aquí o haz clic para seleccionar</h3>
      <p id="uploadSubtitle">soporta mp4, mov, avi, mkv, flv y más formatos</p>
      <button class="btn-primary" id="selectBtn">seleccionar archivos</button>
      <input type="file" id="fileInput" accept="video/*" multiple hidden>
    </div>

    <!-- Controls -->
    <div class="quality-buttons">
      <button class="quality-btn" data-mode="high">
        <strong>alta resolución</strong>
        <small>más peso más calidad</small>
      </button>
      <button class="quality-btn active" data-mode="medium">
        <strong>por defecto</strong>
        <small>recomendado</small>
      </button>
      <button class="quality-btn" data-mode="low">
        <strong>baja resolución</strong>
        <small>menos peso menos calidad</small>
      </button>
    </div>

    <!-- DEBUG: Convertir en las 3 calidades a la vez (quitar cuando no se necesite) -->
    <div id="debugTriple" style="text-align:center; margin-bottom:1rem; display:none;">
      <button id="debugTripleBtn" class="btn-secondary" style="opacity:0.7; font-size:0.85rem;">
        convertir en las 3 calidades
      </button>
      <input type="file" id="debugTripleInput" accept="video/*" hidden>
    </div>

    <!-- Videos Grid -->
    <div id="videosContainer" class="videos-grid">
      <div class="grid-header">
        <h3 id="videoCount">0 videos comprimidos</h3>
        <button class="btn-secondary" id="downloadAllBtn">descargar todo</button>
      </div>
      <div id="videosList" class="videos-list"></div>
    </div>

    <div class="branding-badge">
      <a href="https://meowrhino.studio" target="_blank" rel="noopener noreferrer">meowrhino.studio</a>
    </div>
  </div>

  <script src="ffmpeg.js"></script>
  <script src="script.js"></script>
</body>
</html>
